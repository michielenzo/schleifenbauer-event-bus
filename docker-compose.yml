services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: schleifenbauer
      DB_USER: schleifenbauer
      DB_PASSWORD: schleifenbauer
    ports:
      - "7000:7000"  

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: schleifenbauer
      MARIADB_USER: schleifenbauer
      MARIADB_PASSWORD: schleifenbauer
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"  
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  flyway:
    image: flyway/flyway:10
    depends_on:
      mariadb:
        condition: service_healthy
    command:
      - -url=jdbc:mariadb://mariadb:3306/schleifenbauer
      - -user=schleifenbauer
      - -password=schleifenbauer
      - -connectRetries=60
      - migrate
    volumes:
      - ./db/migration:/flyway/sql:ro
    restart: "no"

volumes:
  mariadb_data:
