services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: schleifenbauer
      DB_USER: schleifenbauer
      DB_PASSWORD: schleifenbauer

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: schleifenbauer
      MARIADB_USER: schleifenbauer
      MARIADB_PASSWORD: schleifenbauer
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"  
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mariadb_data:
